name: Render Butterfly Effect Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Pilih Komposisi Video'
        required: true
        default: 'ButterflyEffect-Shorts'
        type: choice
        options:
          - ButterflyEffect-Shorts
      output_filename:
        description: 'Nama file hasil video (MP4)'
        required: true
        default: 'butterfly_effect_shorts.mp4'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Chromium audio & video codecs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libgbm1 libnss3 libasound2t64 || sudo apt-get install -y ffmpeg libgbm1 libnss3 libasound2

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Render Remotion Video (High-Speed Multi-Core)
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" "out/${{ github.event.inputs.output_filename }}" --concurrency=100% --gl=angle || \
          npx remotion render src/index.ts "${{ github.event.inputs.composition }}" "out/${{ github.event.inputs.output_filename }}" --concurrency=100% --gl=swiftshader

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/*.mp4
          retention-days: 7
